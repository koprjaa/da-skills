[project]
name = "da-skills"
version = "1.0.0"
description = "Twelve Claude Code skills that design a data architecture from scratch or review an existing one."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jan Alexandr Kopřiva", email = "jan.alexandr.kopriva@gmail.com" }]
keywords = ["data-architecture", "data-warehouse", "claude-code", "skills", "data-vault"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.1"]

[project.urls]
Homepage = "https://github.com/koprjaa/da-skills"
Repository = "https://github.com/koprjaa/da-skills"
Issues = "https://github.com/koprjaa/da-skills/issues"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RET", "PTH", "TRY", "PERF", "RUF"]
# E501  line length is handled by the formatter
# TRY003 one exception subclass per message is ceremony
ignore = ["E501", "TRY003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q --strict-markers"

[tool.uv]
package = false
